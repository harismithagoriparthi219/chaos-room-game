<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101126"><meta name="description" content="A fast, secret-role spaceship party game for 4–8 friends.">
  <title>CHAOS ROOM: Trust Nobody!</title>
  <style>
    :root{color-scheme:dark;--bg:#101126;--panel:#1a1c37;--panel2:#232542;--ink:#f5f1ff;--muted:#b5b5d1;--aqua:#6bf2d2;--pink:#ff628c;--gold:#ffd36b;--blue:#9c9aff;--line:#37395d;--shadow:0 14px 34px #08091380}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 15% 0%,#262754 0%,transparent 42%),radial-gradient(ellipse at 100% 55%,#311f4a 0%,transparent 38%),var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}
    button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}button:disabled{opacity:.45;cursor:wait}
    .shell{max-width:1050px;margin:0 auto;padding:18px 20px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.08em}.brand-icon{display:grid;place-items:center;width:38px;height:38px;background:linear-gradient(145deg,var(--pink),#a46dff);border-radius:12px;font-size:21px;box-shadow:0 7px 20px #fd558944}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 11px;color:var(--muted);font-size:12px}.pill.live{border-color:#458e80;color:var(--aqua)}
    main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.card{background:linear-gradient(155deg,#20223fef,#181a32f5);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:clamp(18px,4vw,28px)}.stage{min-height:520px}.side{display:flex;flex-direction:column;gap:14px}.eyebrow{font:500 11px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--aqua)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(34px,7vw,58px);line-height:.98;letter-spacing:-.055em;margin:18px 0 14px}h2{font-size:clamp(24px,5vw,34px);letter-spacing:-.04em;margin:12px 0}h3{font-size:17px;margin:0 0 9px}p{color:var(--muted);line-height:1.55}.hero{padding:10px 0 3px}.hero-title span{color:var(--pink)}.hero-sub{max-width:560px;font-size:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:13px;color:var(--muted)}input{width:100%;background:#111329;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;min-height:48px}input::placeholder{color:#777995}.btn{border:0;border-radius:12px;padding:13px 17px;min-height:47px;font-weight:700;color:#15162b;background:linear-gradient(110deg,var(--aqua),#8fcfff);box-shadow:0 7px 19px #68efd333;transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn.secondary{background:#303251;color:var(--ink);box-shadow:none;border:1px solid var(--line)}.btn.danger{background:linear-gradient(110deg,#ff668f,#ffad79)}.btn.full{width:100%}.divider{height:1px;background:var(--line);margin:21px 0}.error{color:#ff8ba6;font-size:13px;min-height:20px}.hint{font-size:12px;color:var(--muted)}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}.feature{background:#151730;border:1px solid var(--line);border-radius:13px;padding:12px;font-size:12px;color:var(--muted)}.feature b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}.code{font:500 26px 'DM Mono',monospace;letter-spacing:.16em;color:var(--gold)}.players{display:flex;flex-direction:column;gap:8px}.player{display:flex;align-items:center;gap:9px;background:#171930;border:1px solid #2a2c4a;border-radius:12px;padding:9px 11px}.avatar{width:30px;height:30px;border-radius:10px;background:#37325f;display:grid;place-items:center}.player-name{flex:1;font-weight:600;font-size:14px}.tiny{font:11px 'DM Mono',monospace;color:var(--muted)}.meter-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}.meter{height:11px;border-radius:99px;background:#111329;overflow:hidden;border:1px solid #3c3d5b}.meter-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold),var(--aqua));transition:width .3s}.crisis-icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:#292b50;border:1px solid #50517c;margin:10px 0 16px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.option{display:flex;align-items:center;text-align:left;gap:10px;min-height:66px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#171930;color:var(--ink);font-weight:600}.option:hover,.option.selected{border-color:var(--aqua);background:#222c46}.option .num{display:grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:#303251;color:var(--aqua);font:12px 'DM Mono',monospace}.banner{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#16182f;color:var(--muted);line-height:1.45;font-size:13px}.banner.good{border-color:#3b8173;color:#a7f8df}.banner.bad{border-color:#8a3f5a;color:#ffabc0}.role{padding:13px 14px;background:#172b35;border:1px solid #35685f;border-radius:14px;color:var(--aqua);font-weight:700}.role.spy{background:#3a1f35;border-color:#854362;color:#ff9cb5}.side-card{padding:17px}.side-card p{font-size:13px;margin:0}.progress{display:flex;gap:6px;margin:12px 0 2px}.dot{height:7px;flex:1;border-radius:9px;background:#3c3e61}.dot.done{background:var(--aqua)}.dot.now{background:var(--gold)}.feed{font-size:12px;color:var(--muted);line-height:1.5;display:flex;flex-direction:column;gap:7px}.feed-row{border-bottom:1px solid #303251;padding-bottom:7px}.hidden{display:none!important}.footer{text-align:center;font-size:11px;color:#777995;margin:18px 0}.tag{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:5px 8px;font-size:11px;color:var(--muted);margin-right:4px}.score{font:500 18px 'DM Mono',monospace;color:var(--gold)}.modal-note{margin-top:12px;font-size:12px}
    @media(max-width:760px){.shell{padding:12px 12px 24px}.top{margin-bottom:12px}main{grid-template-columns:1fr;gap:12px}.stage{min-height:0}.side{display:grid;grid-template-columns:1fr 1fr}.side .side-card:last-child{grid-column:1/-1}.feature-grid{grid-template-columns:1fr 1fr 1fr}.feature{padding:9px;font-size:11px}.choice-grid{grid-template-columns:1fr}.option{min-height:56px}.hide-mobile{display:none}}
    @media(max-width:420px){.side{grid-template-columns:1fr}.side .side-card:last-child{grid-column:auto}.brand{font-size:13px}.pill{font-size:10px}.row>*{flex:1}}
  </style>
</head>
<body><div class="shell">
  <header class="top"><div class="brand"><div class="brand-icon">🛸</div> CHAOS ROOM <span style="color:var(--pink)">/</span> TRUST NOBODY!</div><div class="pill" id="connection">● Offline</div></header>
  <main><section class="card stage" id="stage" aria-live="polite"></section><aside class="side" id="side"></aside></main>
  <div class="footer">4–8 players · no accounts · one suspiciously wobbly spaceship</div>
</div>
<script>
const $=s=>document.querySelector(s), sessionKey='chaos-room-session-v1';
let session=JSON.parse(localStorage.getItem(sessionKey)||'null'), state=null, source=null, busy=false, message='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(sessionKey,JSON.stringify(session));
async function post(path,data={}){if(busy)return;busy=true;render();try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...data,...(session||{})})});const d=await r.json();if(!r.ok)throw Error(d.error||'Something went wrong.');if(d.state)state=d.state;if(d.id){session={id:d.id,code:d.code};save();connect();}err('');}catch(e){err(e.message);}finally{busy=false;render();}}
function err(s){message=s||'';$('#error')?.replaceChildren(document.createTextNode(message));}
function connect(){if(!session)return;if(source)source.close();source=new EventSource(`/events?code=${encodeURIComponent(session.code)}&pid=${encodeURIComponent(session.id)}`);source.onopen=()=>{$('#connection').textContent='● Synced';$('#connection').className='pill live'};source.onerror=()=>{$('#connection').textContent='● Reconnecting…';$('#connection').className='pill'};source.addEventListener('state',e=>{state=JSON.parse(e.data);render();});}
function clearSession(){if(source)source.close();source=null;session=null;state=null;localStorage.removeItem(sessionKey);message='';render();}
function playerList(){return state.players.map((p,i)=>`<div class="player"><span class="avatar">${['🧑‍🚀','👩‍🚀','🧑‍🔧','👩‍🔬','🦝','🤖','🧑‍🚒','🐙'][i%8]}</span><span class="player-name">${esc(p.name)} ${p.id===state.hostId?'<span class="tiny">HOST</span>':''}</span><span class="tiny">${p.connected?'● HERE':'◌ AWAY'}</span>${state.phase==='results'?`<span>${p.role==='saboteur'?'🟥':'🟩'}</span>`:''}</div>`).join('');}
function sideHTML(){if(!state)return `<div class="card side-card"><h3>How to play</h3><p>Vote on a crisis response, choose a private action, then vote on a suspect. Keep systems above zero for four crises!</p></div><div class="card side-card"><h3>Quick rules</h3><p><span class="tag">Crew</span>Help together<br><span class="tag">Saboteur</span>Blend in or sabotage</p></div>`;
 const progress=`<div class="progress">${[0,1,2,3].map(i=>`<span class="dot ${i<state.round?'done':i===state.round&&state.phase!=='results'?'now':''}"></span>`).join('')}</div>`;
 return `<div class="card side-card"><div class="meter-head"><span>SHIP SYSTEMS</span><b>${state.systems} / 8</b></div><div class="meter"><div class="meter-fill" style="width:${Math.max(0,state.systems/8*100)}%"></div></div>${progress}</div><div class="card side-card"><h3>🚀 Crew (${state.players.length})</h3><div class="players">${playerList()}</div>${state.phase==='lobby'?`<div class="divider"></div><div class="meter-head"><span>ROOM CODE</span></div><div class="code">${state.code}</div><p class="hint">Share this with your crew.</p>`:''}</div><div class="card side-card"><h3>Mission log</h3><div class="feed">${state.history.length?state.history.map(h=>`<div class="feed-row">${h.icon} Crisis ${h.round}: ${h.loss} system point${h.loss===1?'':'s'} lost.${h.accusation?.name?` ${esc(h.accusation.name)} ${h.accusation.correct?'was a saboteur!':'was crew.'}`:''}</div>`).join(''):'<span>All quiet… suspiciously quiet.</span>'}</div></div>`;
}
function render(){
 $('#side').innerHTML=sideHTML();
 if(!state){$('#stage').innerHTML=`<div class="hero"><div class="eyebrow">A 4–8 player social deduction game</div><h1 class="hero-title">THE SHIP IS<br><span>FINE.</span> PROBABLY.</h1><p class="hero-sub">Four crises. Secret saboteurs. One very stressed spaceship. Keep the systems alive and trust absolutely nobody.</p><div class="feature-grid"><div class="feature"><b>🕵️ Secret roles</b>Only you see your role</div><div class="feature"><b>⚡ Fast rounds</b>Vote · act · accuse</div><div class="feature"><b>📱 Any device</b>Room code, no sign-in</div></div><div class="field"><label for="name">YOUR CALLSIGN</label><input id="name" maxlength="18" placeholder="e.g. Captain Noodle" autocomplete="nickname"></div><div class="row"><button class="btn" onclick="createRoom()">🚀 Create a room</button></div><div class="divider"></div><div class="row"><input id="joinCode" maxlength="6" placeholder="ROOM CODE" aria-label="Room code" style="text-transform:uppercase;letter-spacing:.15em"><button class="btn secondary" onclick="joinRoom()">Join crew</button></div><p class="error" id="error"></p></div>`;$('#error').textContent=message;return;}
 const me=state.players.find(p=>p.id===state.myId), isHost=state.myId===state.hostId;
 if(state.phase==='lobby'){$('#stage').innerHTML=`<div class="eyebrow">Crew assembly</div><h2>Welcome aboard, ${esc(me?.name||'Captain')}.</h2><p>Call in 3–7 more friends. The launch button unlocks when at least four players are here.</p><div class="banner good">Room code <strong class="code" style="font-size:20px;margin-left:8px">${state.code}</strong><button class="btn secondary" style="padding:6px 10px;min-height:32px;margin-left:10px" onclick="copyCode()">Copy</button></div><div class="divider"></div>${isHost?`<button class="btn full" onclick="post('/api/start')" ${state.players.length<4||busy?'disabled':''}>${state.players.length<4?`Waiting for crew (${state.players.length}/4)`:'Start the game 🚀'}</button>`:`<div class="banner">Waiting for ${esc(state.players.find(p=>p.id===state.hostId)?.name||'host')} to launch…</div>`}<p class="error" id="error"></p><button class="btn secondary" style="margin-top:14px" onclick="clearSession()">Leave room</button>`;
 }else if(state.phase==='crisis'){$('#stage').innerHTML=`<div class="eyebrow">Crisis ${state.round+1} of 4 · team response · ${state.secondsLeft}s</div><div class="crisis-icon">${state.crisis.icon}</div><h2>${esc(state.crisis.title)}</h2><p>${esc(state.crisis.story)}</p><div class="banner">Discuss quickly, then vote for the team's response. Everyone can see the team's choice. Each pair of helpers cuts damage by 1; a strong plan can cut 1 more. At least 1 system point is lost per crisis.</div><div class="choice-grid">${state.crisis.choices.map((x,i)=>`<button class="option ${state.myTeamVote===i?'selected':''}" onclick="post('/api/team-vote',{choice:${i}})" ${state.myTeamVote!==null||busy?'disabled':''}><span class="num">0${i+1}</span>${esc(x)}</button>`).join('')}</div>${state.myTeamVote!==null?`<div class="banner good">Vote locked. Waiting for the rest of the crew (${state.players.filter(p=>p.voted).length}/${state.players.length})…</div>`:''}<p class="error" id="error"></p>`;
 }else if(state.phase==='actions'){$('#stage').innerHTML=`<div class="eyebrow">Crisis ${state.round+1} · private action · ${state.secondsLeft}s</div><h2>What do you do?</h2><div class="role ${state.myRole==='saboteur'?'spy':''}">${state.myRole==='saboteur'?'🟥 You are a SABOTEUR. Blend in or secretly sabotage.':'🟩 You are CREW. Help keep the ship flying.'}</div><p>Your action is private. Other players see only that you’ve chosen.</p><div class="choice-grid" style="grid-template-columns:1fr">${state.myRole==='saboteur'?`<button class="option" onclick="post('/api/action',{action:'help'})" ${state.myAction?'disabled':''}><span class="num">🤝</span>Help repair the ship</button><button class="option" onclick="post('/api/action',{action:'sabotage'})" ${state.myAction?'disabled':''}><span class="num">🧨</span>Secretly sabotage</button>`:`<button class="option" onclick="post('/api/action',{action:'help'})" ${state.myAction?'disabled':''}><span class="num">🔧</span>Help repair the ship</button><button class="option" onclick="post('/api/action',{action:'hold'})" ${state.myAction?'disabled':''}><span class="num">🫡</span>Hold back and observe</button>`}</div>${state.myAction?`<div class="banner good">Choice locked. Waiting on crew (${state.players.filter(p=>p.acted).length}/${state.players.length})…</div>`:''}<p class="error" id="error"></p>`;
 }else if(state.phase==='accusation'){$('#stage').innerHTML=`<div class="eyebrow">Crisis ${state.round+1} · crew accusation · ${state.secondsLeft}s</div>${state.event?`<div class="banner" style="margin:12px 0">${state.event.icon} ${esc(state.event.title)}: ${state.event.supported} helped, ${state.event.sabotages} sabotage action${state.event.sabotages===1?'':'s'} detected. Systems lost: ${state.event.loss}.</div>`:''}<h2>Who sabotaged the response?</h2><p>Talk it out, then cast one secret vote. The player with the most votes is revealed. Correct guess: +1 system. Wrong guess: −1. A tie or skip means no change.</p><div class="choice-grid" style="grid-template-columns:1fr">${state.accusationEligible.map((p,i)=>`<button class="option ${state.myAccusation===p.id?'selected':''}" onclick="post('/api/accuse',{target:'${p.id}'})" ${state.myAccusation?'disabled':''}><span class="num">${i+1}</span>${esc(p.name)}</button>`).join('')}<button class="option" onclick="post('/api/accuse',{target:null})" ${state.myAccusation?'disabled':''}><span class="num">⏭</span>Skip this accusation</button></div>${state.myAccusation?`<div class="banner good">Vote locked. Waiting on crew (${state.accusationCount}/${state.players.length})…</div>`:''}<p class="error" id="error"></p>`;
 }else{$('#stage').innerHTML=`<div class="eyebrow">Mission complete · final results</div><h2>${state.result?.winner==='crew'?'The crew saved the ship! 🎉':'The saboteurs win! 🧨'}</h2><div class="banner ${state.result?.winner==='crew'?'good':'bad'}">${esc(state.result?.reason||'The game is over.')}</div><div class="divider"></div><h3>Final leaderboard</h3><div class="players">${[...state.scores].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="player"><span class="tiny">#${i+1}</span><span class="player-name">${esc(p.name)} <span class="tiny">${p.role==='saboteur'?'SABOTEUR':'CREW'}</span></span><span class="score">${p.score}</span></div>`).join('')}</div><button class="btn full" style="margin-top:18px" onclick="clearSession()">Play again · create a new room</button>`;}
 if($('#error'))$('#error').textContent=message;
}
async function createRoom(){await post('/api/create',{name:$('#name')?.value});}
async function joinRoom(){await post('/api/join',{name:$('#name')?.value,code:$('#joinCode')?.value});}
async function copyCode(){try{await navigator.clipboard.writeText(state.code);const b=document.querySelector('.banner button');if(b)b.textContent='Copied!';}catch{}}
if(session){fetch(`/api/state?code=${encodeURIComponent(session.code)}&id=${encodeURIComponent(session.id)}`).then(async r=>{if(!r.ok)throw Error('This room session has expired. Join again with a current room code.');return r.json();}).then(d=>{state=d.state;connect();render();}).catch(e=>{session=null;state=null;localStorage.removeItem(sessionKey);err(e.message);render();});}else render();
</script></body></html>
